<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Herbalism</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400&display=swap');
        body { background-color: #F5F2EB; color: #2C3A2E; font-family: 'Inter', sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        h1, h2 { font-family: 'Cormorant Garamond', serif; font-weight: 600; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; border-bottom: 1px solid rgba(44, 58, 46, 0.1); margin-bottom: 40px; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 2rem; text-decoration: none; color: #2C3A2E; display: block; margin-bottom: 15px; }
        nav { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        nav a { text-decoration: none; color: #2C3A2E; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        nav a:hover { color: #8B5A4B; }
        h1 { font-size: 2.5rem; margin-bottom: 20px; text-align: center; }
        .contact-info { text-align: center; margin-bottom: 40px; font-size: 1.1rem; color: #444; }
        form { display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid rgba(44, 58, 46, 0.2); background: white; font-family: 'Inter', sans-serif; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 150px; resize: vertical; }
        button { background-color: #2C3A2E; color: #F5F2EB; padding: 15px; border: none; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1A241B; }
    </style>
</head>
<body>
    <header class="container">
        <a href="index.html" class="logo">Herbalism.</a>
        <nav>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="testimonials.html">Testimonials</a>
            <a href="blog.html">Blog</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <div class="container">
        <h1>Get in Touch</h1>
        
        <div class="contact-info">
            <p>Ready to begin your healing journey?<br>Email: hello@yourwebsite.com<br>Location: Available online & in-person by appointment.</p>
        </div>

        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="How can I help you? (Please do not include sensitive medical information here)"></textarea>
            <button type="button">Send Message</button>
        </form>
    </div>
</body>
</html>
